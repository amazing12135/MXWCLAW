[project]
name = "mxwbot"
version = "0.1.0"
description = "MXWbot - A lightweight, extensible multi-channel chatbot framework"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MXW" }]

dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "httpx>=0.25",
    "aiohttp>=3.9",
    "openai>=1.0",
    "anthropic>=0.30",
    "watchdog>=4.0",
    "croniter>=2.0",
    "tiktoken>=0.5",
    "aiofiles>=23.0",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0",
    "qrcode>=7.0",
]

[project.optional-dependencies]
wechat = ["cryptography>=41.0"]  # token AES-GCM 加密；httpx 已在 core 依赖
qq = ["qq-botpy>=1.0"]          # QQ Bot API v2 WebSocket SDK
email = []                       # 纯标准库（imaplib / smtplib / email）
sandbox = ["bubblewrap>=0.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
]

[project.scripts]
mxwbot = "mxwbot.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["mxwbot"]
